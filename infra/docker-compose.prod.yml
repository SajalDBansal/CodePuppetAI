name: code-puppet-api

services:
  backend:
    image: ${BACKEND_NAME:-codepuppet-backend}:${IMAGE_TAG:-latest}
    container_name: code-puppet-backend
    restart: always
    env_file:
      - ../.env.production
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 10s